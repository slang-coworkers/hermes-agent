# CodeRabbit configuration — slang-coworkers fork override.
#
# Upstream (NousResearch/hermes-agent) ships `auto_review.enabled: false` and summons the
# bot by hand. This fork is driven by the coworker chain: hermes-builder files DRAFT PRs
# against release/<tag>-e2e-fixed and hermes-review consumes CodeRabbit's review of the
# exact head under review (hermes-review WORKFLOW.md, step 5c). Reviews therefore run
# automatically, on drafts, on every push, for release/* bases.
#
# Manual commands still work: `@coderabbitai review` (incremental), `@coderabbitai full review`.
reviews:
  auto_review:
    enabled: true
    drafts: true
    # Bases other than the default branch (regex). The chain never targets main.
    base_branches:
      - "release/.*"
