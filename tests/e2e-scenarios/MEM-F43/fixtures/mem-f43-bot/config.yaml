# ui: model: stub — a loopback mock provider so the profile loads without an
# onboarding overlay; the Skills catalog is read from disk, the model never runs.
model:
  default: mock-model
  provider: mock
providers:
  mock:
    api: http://127.0.0.1:9199/v1
    api_mode: chat_completions
    key_env: MOCK_API_KEY
    models:
      mock-model: {}
    context_length: 4096
# The fleet's learnings clone. Setup rewrites this placeholder to an absolute
# $TB/shared-learnings/skills before the dashboard reads it.
skills:
  external_dirs:
    - ${SHARED_LEARNINGS}/skills
