model:
  provider: coworkers-live
  default: aws/anthropic/bedrock-claude-opus-4-8
providers:
  coworkers-live:
    base_url: https://inference-api.nvidia.com
    api_mode: anthropic_messages
    api_key: dummy-nanoclaw-base-not-a-real-key
    default_model: aws/anthropic/bedrock-claude-opus-4-8
secrets:
  onecli:
    enabled: false
  openshell_trust:
    enabled: true
    override_existing: true
    bundle: /etc/openshell-tls/ca-bundle.pem
  sources:
  - openshell_trust
plugins:
  enabled:
  - nv-coworker-compose
  - nv-fleet-gates
  entries:
    nv-fleet-gates:
      settings:
        enforce_sandbox: true
        edges_db_path: /tmp/hermes-nanoclaw-base/edges.db
        admin_tools:
        - onboard_coworker
        - onboard_project
        - create_agent
        expected_backend: ssh
        mcp_scope:
          orchestrator: {}
          triager: {}
          fixer: {}
          reviewer: {}
          approver: {}
          default: {}
gateway:
  multiplex_profiles: true
  multiplex_profile_allowlist:
  - orchestrator
  - triager
  - fixer
  - reviewer
  - approver
  systemd_watchdog_seconds: 30
platforms:
  webhook:
    enabled: false
    extra:
      routes:
        github-triager:
          enabled: false
          secret: ${env:NANOCLAW_GH_TRIAGER_SECRET}
          profile: triager
          events:
          - issues
          - issue_comment
          deliver: github_comment
          deliver_extra:
            repo: '{repository.full_name}'
            pr_number: '{issue.number}'
        github-fixer:
          enabled: false
          secret: ${env:NANOCLAW_GH_FIXER_SECRET}
          profile: fixer
          events:
          - pull_request
          - push
          deliver: github_comment
          deliver_extra:
            repo: '{repository.full_name}'
            pr_number: '{pull_request.number}'
        github-reviewer:
          enabled: false
          secret: ${env:NANOCLAW_GH_REVIEWER_SECRET}
          profile: reviewer
          events:
          - pull_request_review
          - pull_request_review_comment
          deliver: github_comment
          deliver_extra:
            repo: '{repository.full_name}'
            pr_number: '{pull_request.number}'
      group_sessions_per_user: true
      thread_sessions_per_user: false
terminal:
  backend: ssh
sessions:
  auto_prune: false
  auto_archive: true
compression:
  in_place: true
checkpoints:
  auto_prune: false
memory:
  memory_char_limit: 4000
  user_char_limit: 2000
  write_approval: false
curator:
  enabled: true
  backup:
    enabled: true
    keep: 5
command_allowlist: []
approvals:
  deny:
  - git *push* --forc*
  - git *push* -f
  - git *push* -f *
  - git *push* -f[!- ]*
  - git *push* -[!- ]f*
  - git *push* -[!- ][!- ]f*
  - git push* *+*
  - git -*push* *+*
  - git tag *
  - git -* tag *
  - gh release *
  - gh -* release *
group_sessions_per_user: true
thread_sessions_per_user: false
