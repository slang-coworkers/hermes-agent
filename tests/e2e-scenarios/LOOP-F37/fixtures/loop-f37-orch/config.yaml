# Live provider block — self-contained, survives both live-tier failure modes;
# see loop-f37-worker-a/config.yaml for the full rationale: NO key_env (the
# delivery subprocess blocks ANTHROPIC_* — local.py:359-361; the inline api_key
# is the resolver fallback, runtime_provider.py:819-821), REMOTE non-loopback
# base_url (the SKILL.md:304 live-tier mandate — routes through the egress proxy
# that injects the real key; avoids the loopback ephemeral-port fragility),
# literal on-disk dummy api_key (never a real key).
model:
  provider: coworkers-live
  default: aws/anthropic/bedrock-claude-opus-4-8
providers:
  coworkers-live:
    base_url: https://inference-api.nvidia.com
    api_mode: anthropic_messages
    api_key: dummy-loop-f37-not-a-real-key
    default_model: aws/anthropic/bedrock-claude-opus-4-8
timezone: Asia/Kolkata
sessions:
  auto_prune: false
approvals:
  mode: smart
plugins:
  enabled:
    - nv-fleet-gates
  entries:
    nv-fleet-gates:
      settings:
        profile: loop-f37-orch
        # Same shared edges store as loop-f37-worker-a for this scenario.
        edges_db_path: /tmp/loop-f37-a2a-fleet-edges.db
        profile_roles:
          loop-f37-worker-a: worker
          loop-f37-orch: orchestrator
        enforce_sandbox: false
        plan_gate: false
        required_stages:
          - OUTPUT_REVIEW
        stage_markers:
          - "[Fix Report]"
          - "[Review Verdict]"
          - "[Resolution]"
          - "[handoff]"
        admin_tools:
          - onboard_coworker
          - onboard_project
          - create_agent
