name: loop-f37-bot-a
version: 0.1.0
description: "LOOP-F37 live wired-only messaging scenario — bot A (the message_agent sender). Runs nv-fleet-gates against a shared edges store; used to prove an unwired send is refused-not-logged and a wired send round-trips."
author: hermes-builder
env_requires:
  # Written post-install by the harness; the local OneCLI egress proxy
  # substitutes the real outbound credential per request. A real key never
  # touches the fixture — ANTHROPIC_API_KEY stays a dummy literal.
  - name: ANTHROPIC_API_KEY
    description: "Dummy key for the coworkers-live provider; the OneCLI egress proxy substitutes the real credential for inference-api.nvidia.com."
    required: false
distribution_owned:
  - SOUL.md
  - config.yaml
  - distribution.yaml
