# Live provider block — self-contained, survives BOTH live-tier failure modes
# (verified in the pinned tree):
#   1. NO key_env: the recipient's message_agent reply runs in the secret-
#      sanitised delivery subprocess, which BLOCKS ANTHROPIC_API_KEY and
#      ANTHROPIC_BASE_URL (tools/environments/local.py:359-361), so a key_env
#      block resolves empty there. A literal on-disk api_key is read from
#      config.yaml (not env) and is the resolver's fallback credential
#      (runtime_provider.py:819-821) → provider IS configured, and it is the
#      x-api-key the egress proxy substitutes.
#   2. REMOTE (non-loopback) base_url: the SKILL.md:304 live-tier mandate. The
#      remote host routes through the OneCLI egress proxy (host.docker.internal;
#      the proxy env vars survive the subprocess strip), which injects the real
#      credential. Chosen over a loopback wire to avoid the ephemeral-port
#      fragility that blocked LOOP-F35 — and the ${ANTHROPIC_BASE_URL} claude-
#      trace gateway loopback would 403 the dummy key (no_proxy bypass). (Not
#      "all loopback fails": the substrate LiteLLM wire serves 200; remote just
#      avoids both the port fragility and the gateway-loopback 403.)
# The dummy api_key never carries a real secret.
model:
  provider: coworkers-live
  default: aws/anthropic/bedrock-claude-opus-4-8
providers:
  coworkers-live:
    base_url: https://inference-api.nvidia.com
    api_mode: anthropic_messages
    api_key: dummy-loop-f37-not-a-real-key
    default_model: aws/anthropic/bedrock-claude-opus-4-8
timezone: Asia/Kolkata
sessions:
  auto_prune: false
# smart mode surfaces the gated-edge approve as an INTERACTIVE hold; an
# unattended / single_query session would auto-deny it instead (AC-A2A-F19-2).
approvals:
  mode: smart
plugins:
  enabled:
    - nv-fleet-gates
  entries:
    nv-fleet-gates:
      settings:
        profile: loop-f37-worker-a
        # Distinct from the AC-CH-F51-1 edges store so the two live scenarios do
        # not collide when installed into the same shared testbed home. The
        # scenario Setup seeds exactly one GATED edge worker-a -> orch here.
        edges_db_path: /tmp/loop-f37-a2a-fleet-edges.db
        profile_roles:
          loop-f37-worker-a: worker
          loop-f37-orch: orchestrator
        enforce_sandbox: false
        plan_gate: false
        required_stages:
          - OUTPUT_REVIEW
        stage_markers:
          - "[Fix Report]"
          - "[Review Verdict]"
          - "[Resolution]"
          - "[handoff]"
        admin_tools:
          - onboard_coworker
          - onboard_project
          - create_agent
