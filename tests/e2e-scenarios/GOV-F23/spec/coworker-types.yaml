# GOV-F23 AC-6 compose-input spec. The worker profile is RENDERED BY THE COMPOSE
# PLUGIN (the criterion requires "a coworker profile rendered by the compose
# plugin"), never shipped pre-built: the render writes the per-role
# command_allowlist + approvals.deny into the worker config.yaml and emits the
# fleet-uniform approvals block into <out>/managed/config.yaml. The scenario
# installs the rendered worker as `gov-f23-worker` and the rendered managed
# fragment into the testbed managed dir, then runs the worker single-query.
#
# The worker's command_allowlist covers flagged-dangerous verbs it legitimately
# runs (git clean / git reset --hard) but deliberately NOT `rm -rf gov-f23-victim`,
# so that command reaches the single_query_mode=deny branch and is BLOCKED.
project: gov-f23-live
default_profile: default
orchestrator_profile: gov-f23-orchestrator
worker_profile: gov-f23-worker

spines:
  live-base:
    source: spines/live-base.yaml

skills_root: skills

types:
  gov-f23-worker:
    extends: [live-base]
    identity: "You are a GOV-F23 single-query worker. When asked to run a shell command, use your terminal/shell tool to run exactly the command requested."
    config:
      command_allowlist: ["git clean -fd*", "git reset --hard*"]
      approvals:
        deny: ["git push --force*", "git push -f*", "git tag *", "gh release *"]
    ui_meta: {title: "Worker", description: "GOV-F23 single-query worker", shape: "square"}
  gov-f23-orchestrator:
    extends: [live-base]
    identity: "GOV-F23 orchestrator profile."
    ui_meta: {title: "Orchestrator", description: "GOV-F23 orchestrator", shape: "hexagon"}

rooms:
  gov-f23-room:
    name: "GOV-F23 Live"
    members: [gov-f23-worker, gov-f23-orchestrator]
