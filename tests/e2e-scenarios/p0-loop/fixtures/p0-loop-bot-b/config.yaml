model:
  default: nvidia/llama-3.1-nemotron-70b-instruct
  provider: nvidia
providers:
  nvidia:
    api: https://integrate.api.nvidia.com/v1
    api_mode: chat_completions
    # nvidia is a canonical provider whose credential lookup is NVIDIA_API_KEY
    # (hermes_cli/auth.py:450-455); the OneCLI proxy injects the real key per
    # request, so the value written post-install stays a placeholder.
    key_env: NVIDIA_API_KEY
    models:
      nvidia/llama-3.1-nemotron-70b-instruct: {}
plugins:
  enabled:
    - hello
    - a2a-platform
# a2a inbound listener on loopback; no extra.agents, so the default agent
# answers the root url bot-a dials (plugins/platforms/a2a/adapter.py:346).
platforms:
  a2a:
    enabled: true
    extra:
      port: 9120
