name: p0-loop-bot-b
version: "0.1.0"
description: "P0-LOOP AC-3 fixture: the inbound peer. Loads hello + a2a-platform, serves its default agent behind an a2a listener on 127.0.0.1:9120, runs against the live tier."
author: hermes-builder
env_requires:
  # Written post-install by the harness; the local OneCLI proxy substitutes the
  # real outbound credential per request (hermes-testbed §3a). A real key never
  # touches the fixture — ANTHROPIC_API_KEY stays a dummy.
  - name: ANTHROPIC_API_KEY
    description: "Dummy key for the coworkers-live provider; harness writes ANTHROPIC_API_KEY=dummy post-install and the OneCLI egress proxy substitutes the real credential for inference-api.nvidia.com's host."
    required: false
