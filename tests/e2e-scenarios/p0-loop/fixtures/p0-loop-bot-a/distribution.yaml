name: p0-loop-bot-a
version: "0.1.0"
description: "P0-LOOP AC-3 fixture: the driver bot. Loads hello + a2a-platform, knows peer bot-b at 127.0.0.1:9120, runs against the live tier."
author: hermes-builder
env_requires:
  # Written post-install by the harness; the OneCLI proxy injects the real
  # NVIDIA credential per request (hermes-testbed §3a). A real key never
  # touches the fixture — NVIDIA_API_KEY stays the placeholder unused-testbed.
  - name: NVIDIA_API_KEY
    description: "Placeholder key for the canonical nvidia provider; harness writes NVIDIA_API_KEY=unused-testbed post-install and the OneCLI proxy injects the real credential."
    required: false
