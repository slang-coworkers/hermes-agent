version: 1
filesystem_policy:
  include_workdir: true
  read_only:
  - /usr
  - /bin
  - /lib
  - /etc
  read_write:
  - /tmp
landlock:
  compatibility: best-effort
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  worker-egress:
    name: worker-egress
    binaries:
    - path: /usr/bin/curl
    endpoints:
    - host: 172.17.0.1
      port: 10255
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: '*'
          path: /*
    - host: inference-api.nvidia.com
      port: 443
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: '*'
          path: /*
    - host: 172.17.0.1
      port: 22
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: '*'
          path: /*
