# OSH-F63 fleet spine (openshell column). Every coworker `extends: [base]`, and the
# render merges this config into the DEFAULT profile too. The FULL providers block
# lives here (inline dummy api_key, remote base_url reached through the OneCLI egress
# proxy) so it survives `hermes onboard coworker`. plugins.enabled + the nv-fleet-gates
# settings are declared once here (the declare-in-spine pattern) so every coworker
# carries them; the render derives expected_backend from the substrate descriptor
# (openshell -> "ssh") and emits the managed-scope profile_roles map itself.
#
# Unlike the podman column this spine does NOT enable podman-onecli and sets no
# terminal.* container keys: the OpenShell substrate reaches each sandbox over the
# builtin ssh backend, so there is no per-profile container to configure here — the
# render writes terminal.backend: ssh + the per-profile ssh block + the per-profile
# openshell policy itself.
identity: "OSH-F63 fleet base"
config:
  model:
    provider: coworkers-live
    default: aws/anthropic/bedrock-claude-opus-4-8
  providers:
    coworkers-live:
      base_url: https://inference-api.nvidia.com
      api_mode: anthropic_messages
      api_key: dummy-osh-f63-not-a-real-key
      default_model: aws/anthropic/bedrock-claude-opus-4-8
  timezone: Asia/Kolkata
  secrets:
    onecli:
      enabled: true
  plugins:
    enabled:
      - nv-coworker-compose
      - nv-fleet-gates
    entries:
      nv-fleet-gates:
        settings:
          enforce_sandbox: true
          edges_db_path: /tmp/hermes-osh-f63/edges.db
          admin_tools:
            - onboard_coworker
            - onboard_project
            - create_agent
