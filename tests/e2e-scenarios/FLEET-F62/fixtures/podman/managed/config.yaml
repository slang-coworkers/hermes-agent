approvals:
  mode: smart
  timeout: 300
  cron_mode: deny
  single_query_mode: deny
  unattended_mode: deny
  denial_breaker_threshold: 3
security:
  approval:
    transport: builtin
    transport_fallback: deny
plugins:
  entries:
    nv-fleet-gates:
      settings:
        profile_roles:
          orchestrator: orchestrator
          architect: worker
          builder: worker
          tester: worker
          reviewer: worker
proxy:
  enabled: false
