name: fleet-f62-h-bot-a
version: "0.1.0"
description: "FLEET-F62.h AC-16 fixture: bot A, the message_agent sender (and the orchestrator profile the re-drive plugin reports to)."
author: hermes-builder
distribution_owned:
  - SOUL.md
  - config.yaml
  - profile.yaml
  - distribution.yaml
env_requires:
  # Written post-install by the harness; the OneCLI egress proxy substitutes the real credential per request
  # for inference-api.nvidia.com. A real key never touches the fixture.
  - name: ANTHROPIC_API_KEY
    description: "Dummy key for the coworkers-live provider; the OneCLI egress proxy substitutes the real credential."
    required: false
