version: 1
filesystem_policy:
  include_workdir: true
  read_only:
  - /usr
  - /bin
  - /lib
  - /etc
  - /opt/hermes
  - /proc
  - /dev/urandom
  read_write:
  - /tmp
  - /sandbox
  - /dev/null
  - /dev/pts
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  worker-egress:
    name: worker-egress
    binaries:
    - path: /usr/bin/curl
    - path: /opt/hermes/.venv/bin/python
    endpoints:
    - host: inference.local
      port: 443
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: POST
          path: /v1/chat/completions
      - allow:
          method: POST
          path: /v1/messages
      - allow:
          method: POST
          path: /v1/responses
      - allow:
          method: GET
          path: /v1/models
    - host: 172.17.0.1
      port: 18777
      tls: skip
