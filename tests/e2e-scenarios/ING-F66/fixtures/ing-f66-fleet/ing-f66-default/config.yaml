model:
  provider: compatible-endpoint
  default: aws/anthropic/bedrock-claude-opus-5-5
providers:
  compatible-endpoint:
    base_url: https://inference.local/v1
    api_mode: chat_completions
    api_key: sk-OPENSHELL-PROXY-REWRITE
    default_model: aws/anthropic/bedrock-claude-opus-5-5
    extra_headers:
      X-Hermes-Profile: ing-f66-default
plugins:
  enabled:
  - nv-coworker-compose
  - nv-fleet-gates
  - nv-ingress
  entries:
    nv-fleet-gates:
      settings:
        enforce_sandbox: true
        edges_db_path: /tmp/hermes-nanoclaw-base/edges.db
        admin_tools:
        - onboard_coworker
        - onboard_project
        - create_agent
        expected_backend: ssh
        mcp_scope:
          orchestrator: {}
          triager: {}
          fixer: {}
          reviewer: {}
          approver: {}
          default: {}
    nv-ingress:
      settings:
        route: ingress
        orchestrator_profile: orchestrator
        issue_labels:
        - ing-f66-fleet
        self_logins:
        - slang-coworkers-bot
        per_pr_hourly_budget: 30
        webhook_guard: true
  disabled:
  - web-firecrawl
  - browser-firecrawl
gateway:
  multiplex_profiles: true
  multiplex_profile_allowlist:
  - orchestrator
  - triager
  - fixer
  - reviewer
  - approver
  systemd_watchdog_seconds: 30
terminal:
  backend: ssh
sessions:
  auto_prune: false
  auto_archive: true
compression:
  in_place: true
checkpoints:
  auto_prune: false
memory:
  memory_char_limit: 4000
  user_char_limit: 2000
  write_approval: false
curator:
  enabled: true
  backup:
    enabled: true
    keep: 5
command_allowlist: []
approvals:
  deny:
  - git *push* --forc*
  - git *push* -f
  - git *push* -f *
  - git *push* -f[!- ]*
  - git *push* -[!- ]f*
  - git *push* -[!- ][!- ]f*
  - git push* *+*
  - git -*push* *+*
  - git tag *
  - git -* tag *
  - gh release *
  - gh -* release *
group_sessions_per_user: true
thread_sessions_per_user: false
platforms:
  webhook:
    enabled: true
    extra:
      host: 127.0.0.1
      port: 18644
      routes:
        ingress:
          secret: INSECURE_NO_AUTH
          script: ingress_stage.py
          events:
          - ingress.v1
          profile: default
attribution_tag: ing-f66-default
