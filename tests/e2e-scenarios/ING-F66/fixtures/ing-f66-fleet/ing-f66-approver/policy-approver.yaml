version: 1
filesystem_policy:
  include_workdir: true
  read_only:
  - /usr
  - /bin
  - /lib
  - /etc
  read_write:
  - /tmp
  - /dev/null
  - /home/sandbox
  - /workspace
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  worker-egress:
    name: worker-egress
    binaries:
    - path: /usr/bin/curl
    endpoints:
    - host: 172.17.0.1
      port: 18777
      tls: skip
    - host: api.github.com
      port: 443
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: GET
          path: /**
