version: 1
filesystem_policy:
  include_workdir: true
  read_only:
  - /usr
  - /bin
  - /lib
  - /etc
  - /opt/osh-lane
  read_write:
  - /tmp
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  worker-egress:
    name: worker-egress
    binaries:
    - path: /usr/bin/curl
    - path: /usr/bin/python3*
    - path: /opt/hermes/.venv/bin/python
    endpoints:
    - host: 172.17.0.1
      port: 18255
      tls: skip
    - host: inference-api.nvidia.com
      port: 443
      protocol: rest
      enforcement: enforce
      rules:
      - allow:
          method: POST
          path: /**
    - host: 172.17.0.1
      port: 18777
      tls: skip
