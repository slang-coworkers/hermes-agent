# MEM-F44 compose input — omitted variant of the shared spine.
identity: "BASE-IDENTITY"
invariants: ["INV-SHARED"]
context: ["CTX-SHARED"]
skills: ["shared-skill"]
workflows: ["hermes-verify"]
traits:
  command_allowlist: ["git status"]
config:
  timezone: "Asia/Kolkata"
  # All four retention keys are omitted here so the render must INSERT each one
  # at the fleet-safe value. A setdefault-style render passes this variant but
  # fails the unsafe variant (base.yaml); a correct render passes both.
  memory: {memory_char_limit: 4000, user_char_limit: 2000}
  skills: {external_dirs: ["/data/shared-skills"]}
  terminal:
    backend: "docker"
    docker_env: {}
    docker_mount_cwd_to_workspace: true
    docker_image: "hermes-sandbox:pinned"
    docker_volumes: []
  approvals:
    mode: "smart"
    timeout: 300
    cron_mode: "deny"
    unattended_mode: "deny"
    single_query_mode: "deny"
  agent:
    disabled_toolsets: []
  plugins:
    enabled: ["nv-fleet-gates"]
    entries:
      nv-fleet-gates:
        settings:
          enabled: true
          policy: "deny-admin-to-workers"
      nv-cost-cap:
        settings:
          ceiling_usd: 20
  cron: {failure_nudge_threshold: 3}
