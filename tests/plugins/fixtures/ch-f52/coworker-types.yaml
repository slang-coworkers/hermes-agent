# Compose spec for the CH-F52 acceptance test. Test secrets are literal and
# pairwise-distinct so the test can compute a valid per-route HMAC; production
# fleets use env-referenced secrets and their real bot handles.
project: slang-github-ingress
default_profile: default
orchestrator_profile: orchestrator

spines:
  base:
    source: spines/base.yaml

# Coworker types. No skills/workflows/overlays are declared, so the render needs
# no skill files.
types:
  orchestrator:
    extends: [base]
    identity: "Slang fleet orchestrator — triages GitHub issues and mention-gated comments."
  reviewer:
    extends: [base]
    identity: "Slang fleet reviewer — reviews pull requests."
  fixer:
    extends: [base]
    identity: "Slang fleet fixer — addresses review feedback and CI failures."

# Webhook routes live only on the DEFAULT (multiplexer) profile; a coworker
# profile that enables a port-binding platform is skipped at gateway startup.
default_config:
  gateway:
    multiplex_profiles: true
    multiplex_profile_allowlist: [orchestrator, reviewer, fixer]
  platforms:
    webhook:
      enabled: true
      extra:
        routes:
          gh-issues:
            secret: "ch-f52-secret-issues"
            profile: orchestrator
            events: [issues]
            filters:
              - field: action
                in: [opened, reopened]
            prompt: "GitHub issues event on {repository.full_name}: issue #{issue.number} {issue.title}. Triage per the fleet workflow."
            skills: [github-issue-triage]
          gh-issue-comment:
            secret: "ch-f52-secret-comment"
            profile: orchestrator
            events: [issue_comment]
            filters:
              - field: action
                in: [created]
              - field: comment.body
                contains: "@slang-orchestrator"
            prompt: "GitHub issue comment on {repository.full_name} (issue #{issue.number}): {comment.body}"
            skills: [github-comment-triage]
          # LOOP-F40: CI-gated reviewer route. pr_ci_gate.py parks a per-head
          # blocked review card and returns [SILENT] — no immediate dispatch;
          # gh-check-suite promotes the card once CI is green for that head.
          gh-pull-request:
            secret: "ch-f52-secret-pr"
            profile: reviewer
            events: [pull_request]
            filters:
              - field: action
                in: [opened, reopened, synchronize, ready_for_review]
            script: pr_ci_gate.py
          gh-pr-review:
            secret: "ch-f52-secret-review"
            profile: fixer
            events: [pull_request_review]
            filters:
              - field: action
                in: [submitted]
            prompt: "GitHub pull_request_review on {repository.full_name}: PR #{pull_request.number}. Address the review feedback."
            skills: [github-review-triage]
          # LOOP-F40: check_gate.py promotes the current head's parked card to
          # ready on a CI success ([SILENT]); on a non-success it returns the
          # payload so this fixer-bound route wakes the fixer with the prompt.
          gh-check-suite:
            secret: "ch-f52-secret-check"
            profile: fixer
            events: [check_suite]
            filters:
              - field: action
                in: [completed]
            script: check_gate.py
            prompt: "GitHub check_suite completed on {repository.full_name}: conclusion {check_suite.conclusion}. Investigate the CI failure."
            skills: [github-ci-triage]
          # LOOP-F40: human-invited reviewer post-back. Fires only when a real
          # human (comment.user.type == User, not the reviewer bot itself)
          # boundary-mentions the reviewer on a PR (issue.pull_request present).
          # The reviewer run it dispatches shells the READ-only `gh pr diff`
          # (toolsets grants `terminal` on top of the `terminal`-less
          # hermes-webhook default), and the route posts the review back via
          # deliver: github_comment.
          gh-pr-review-invite:
            secret: "ch-f52-secret-invite"
            profile: reviewer
            events: [issue_comment]
            filters:
              - field: action
                in: [created]
              - field: issue.pull_request
                exists: true
              - field: comment.user.type
                equals: "User"
              - field: comment.user.login
                not_equals: "slang-reviewer[bot]"
              - field: comment.body
                regex: "(?i)(?<![A-Za-z0-9-])@slang-reviewer(?![A-Za-z0-9-])"
            prompt: "A human invited a review on {repository.full_name} PR #{issue.number}: {comment.body}. Read the change with `gh pr diff {issue.number} --repo {repository.full_name}` and post a concise, actionable review."
            skills: [sdlc-review]
            toolsets: [terminal, hermes-webhook]
            deliver: github_comment
            deliver_extra:
              repo: "{repository.full_name}"
              pr_number: "{issue.number}"
workspace_root: /data/coworkers
