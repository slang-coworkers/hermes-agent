# MEM-F42 compose input — omitted variant of the shared spine. The whole curator
# block is omitted, so the render must INSERT the three safety keys at their
# fleet-safe values. A setdefault-style render passes this variant but fails the
# unsafe variant (base.yaml); a correct force-write render passes both.
identity: "BASE-IDENTITY"
invariants: ["INV-SHARED"]
context: ["CTX-SHARED"]
skills: ["shared-skill"]
workflows: ["hermes-verify"]
traits:
  command_allowlist: ["git status"]
config:
  timezone: "Asia/Kolkata"
  sessions: {auto_prune: false, auto_archive: true}
  compression: {in_place: true}
  checkpoints: {auto_prune: false}
  memory: {memory_char_limit: 4000, user_char_limit: 2000}
  # No curator block at all -> render must INSERT curator.enabled: true,
  # curator.backup.enabled: true, curator.backup.keep: 5.
  skills: {external_dirs: ["/data/shared-skills"]}
  terminal:
    container_persistent: true  # ISO-F13: explicit per-role sandbox lifetime
    backend: "docker"
    docker_env: {}
    docker_mount_cwd_to_workspace: true
    docker_image: "hermes-sandbox:pinned"
    docker_volumes: []
  approvals:
    mode: "smart"
    timeout: 300
    cron_mode: "deny"
    unattended_mode: "deny"
    single_query_mode: "deny"
  agent:
    disabled_toolsets: []
  plugins:
    enabled: ["nv-fleet-gates"]
    entries:
      nv-fleet-gates:
        settings:
          enabled: true
          policy: "deny-admin-to-workers"
      nv-cost-cap:
        settings:
          ceiling_usd: 20
  cron: {failure_nudge_threshold: 3}
