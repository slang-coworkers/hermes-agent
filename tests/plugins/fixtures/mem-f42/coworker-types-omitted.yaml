# MEM-F42 compose input — omitted variant. Same roster as coworker-types.yaml but
# the input omits the curator block everywhere (spine base-omitted.yaml + every
# type + this default_config), so the render must INSERT the three curator safety
# keys at their fleet-safe values on every profile.
project: demo
default_profile: default
orchestrator_profile: orchestrator
worker_profile: reviewer

spines:
  base:
    source: spines/base-omitted.yaml

skills_root: skills
workflows_root: workflows
overlays_root: overlays

types:
  orchestrator:
    extends: [base]
    identity: "ORCH-IDENTITY"
    ui_meta: {title: "Orchestrator", description: "Fleet orchestrator", shape: "hexagon"}
  reviewer:
    extends: [base]
    identity: "REVIEWER-IDENTITY"
    invariants: ["INV-SHARED", "INV-REVIEWER"]
    context: ["CTX-SHARED", "CTX-REVIEWER"]
    skills: ["review-skill"]
    overlays: ["critique-gate"]
    traits:
      command_allowlist: ["git status", "gh pr view"]
    ui_meta: {title: "Reviewer", description: "PR reviewer", shape: "diamond"}
  fixer:
    extends: [base]
    identity: "FIXER-IDENTITY"
    skills: ["fix-skill"]
    ui_meta: {title: "Fixer", description: "Implementer", shape: "square"}

rooms:
  fleet-room:
    name: "Fleet"
    members: [orchestrator, reviewer, fixer]

# DEFAULT (multiplexer) profile — curator block omitted here too.
default_config:
  gateway:
    multiplex_profiles: true
    multiplex_profile_allowlist: [orchestrator, reviewer, fixer]
  platforms:
    webhook:
      extra:
        routes:
          pr:
            secret: "SECRET-PR"
            profile: reviewer
            events: [pull_request]

# ISO-F13: mandatory fleet key — workspace root mounted rw per coworker,
# outside the fleet Hermes root. A spec omitting it now fails closed.
workspace_root: /data/coworkers
